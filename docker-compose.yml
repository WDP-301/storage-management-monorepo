services:
  postgres:
    image: postgres:16-alpine
    container_name: storage-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: storage_management_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storage_management_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: storage-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_DATABASE: storage_management_db
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      ENABLE_SWAGGER: "true"
    depends_on:
      postgres:
        condition: service_healthy

  storage-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: storage-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    depends_on:
      - storage-api

volumes:
  postgres_data:
    driver: local
