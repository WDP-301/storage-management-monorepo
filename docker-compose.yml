services:
  postgres:
    image: postgres:16-alpine
    container_name: storage-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: storage_management_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storage_management_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: storage-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfspassword
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs_data:/data

  storage-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: storage-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_DATABASE: storage_management_db
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      ENABLE_SWAGGER: "true"
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfspassword
      S3_BUCKET: storage-management-bucket
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  storage-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: storage-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    depends_on:
      - storage-api

volumes:
  postgres_data:
    driver: local
  rustfs_data:
    driver: local
